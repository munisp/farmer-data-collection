version: '3.9'

# Production-Grade HA Infrastructure
# All services configured for high availability with replication, clustering, and failover

networks:
  farmer-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  # Kafka
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  zk-1-data:
  zk-2-data:
  zk-3-data:
  
  # PostgreSQL Patroni
  pg-1-data:
  pg-2-data:
  pg-3-data:
  
  # Redis Sentinel
  redis-master-1-data:
  redis-master-2-data:
  redis-master-3-data:
  redis-replica-1-data:
  redis-replica-2-data:
  redis-replica-3-data:
  
  # Temporal
  temporal-cassandra-1-data:
  temporal-cassandra-2-data:
  temporal-cassandra-3-data:
  
  # APISIX etcd
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:
  
  # TigerBeetle
  tigerbeetle-1-data:
  tigerbeetle-2-data:
  tigerbeetle-3-data:
  tigerbeetle-4-data:
  tigerbeetle-5-data:
  tigerbeetle-6-data:
  
  # Fluvio
  fluvio-1-data:
  fluvio-2-data:
  fluvio-3-data:
  
  # MinIO (Data Lake)
  minio-1-data:
  minio-2-data:
  minio-3-data:
  minio-4-data:
  
  # Keycloak
  keycloak-db-data:
  
  # Monitoring
  prometheus-data:
  grafana-data:
  loki-data:

services:
  # ============================================================================
  # ZOOKEEPER CLUSTER (3 nodes for Kafka)
  # ============================================================================
  
  zookeeper-1:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper-1
    container_name: zookeeper-1
    networks:
      - farmer-network
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    volumes:
      - zk-1-data:/var/lib/zookeeper/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper-2:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper-2
    container_name: zookeeper-2
    networks:
      - farmer-network
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    volumes:
      - zk-2-data:/var/lib/zookeeper/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper-3:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper-3
    container_name: zookeeper-3
    networks:
      - farmer-network
    ports:
      - "2183:2181"
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888
    volumes:
      - zk-3-data:/var/lib/zookeeper/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # KAFKA CLUSTER (3 brokers, replication factor 3)
  # ============================================================================
  
  kafka-1:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-1
    container_name: kafka-1
    networks:
      - farmer-network
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-2:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-2
    container_name: kafka-2
    networks:
      - farmer-network
    ports:
      - "9093:9093"
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-3:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-3
    container_name: kafka-3
    networks:
      - farmer-network
    ports:
      - "9094:9094"
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9094"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # REDIS SENTINEL HA (3 masters + 3 replicas)
  # ============================================================================
  
  redis-master-1:
    image: redis:7.2-alpine
    hostname: redis-master-1
    container_name: redis-master-1
    networks:
      - farmer-network
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-master-1-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-replica-1:
    image: redis:7.2-alpine
    hostname: redis-replica-1
    container_name: redis-replica-1
    networks:
      - farmer-network
    ports:
      - "6380:6379"
    command: redis-server --replicaof redis-master-1 6379 --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-replica-1-data:/data
    depends_on:
      - redis-master-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-1:
    image: redis:7.2-alpine
    hostname: redis-sentinel-1
    container_name: redis-sentinel-1
    networks:
      - farmer-network
    ports:
      - "26379:26379"
    command: >
      sh -c "echo 'port 26379
      sentinel monitor mymaster redis-master-1 6379 2
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 10000' > /etc/redis-sentinel.conf &&
      redis-sentinel /etc/redis-sentinel.conf"
    depends_on:
      - redis-master-1
      - redis-replica-1
    restart: unless-stopped

  # ============================================================================
  # POSTGRESQL PATRONI CLUSTER (3 nodes + PgBouncer)
  # ============================================================================
  
  etcd-patroni:
    image: quay.io/coreos/etcd:v3.5.11
    hostname: etcd-patroni
    container_name: etcd-patroni
    networks:
      - farmer-network
    ports:
      - "2379:2379"
    environment:
      ETCD_NAME: etcd-patroni
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-patroni:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-patroni:2379
      ETCD_INITIAL_CLUSTER: etcd-patroni=http://etcd-patroni:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: patroni-cluster
    restart: unless-stopped

  patroni-1:
    image: patroni/patroni:3.2.2
    hostname: patroni-1
    container_name: patroni-1
    networks:
      - farmer-network
    ports:
      - "5432:5432"
      - "8008:8008"
    environment:
      PATRONI_NAME: patroni-1
      PATRONI_SCOPE: farmer-cluster
      PATRONI_ETCD3_HOSTS: etcd-patroni:2379
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni-1:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni-1:8008
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farmer_db
    volumes:
      - pg-1-data:/var/lib/postgresql/data
    depends_on:
      - etcd-patroni
    restart: unless-stopped

  patroni-2:
    image: patroni/patroni:3.2.2
    hostname: patroni-2
    container_name: patroni-2
    networks:
      - farmer-network
    ports:
      - "5433:5432"
      - "8009:8008"
    environment:
      PATRONI_NAME: patroni-2
      PATRONI_SCOPE: farmer-cluster
      PATRONI_ETCD3_HOSTS: etcd-patroni:2379
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni-2:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni-2:8008
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farmer_db
    volumes:
      - pg-2-data:/var/lib/postgresql/data
    depends_on:
      - etcd-patroni
    restart: unless-stopped

  patroni-3:
    image: patroni/patroni:3.2.2
    hostname: patroni-3
    container_name: patroni-3
    networks:
      - farmer-network
    ports:
      - "5434:5432"
      - "8010:8008"
    environment:
      PATRONI_NAME: patroni-3
      PATRONI_SCOPE: farmer-cluster
      PATRONI_ETCD3_HOSTS: etcd-patroni:2379
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni-3:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni-3:8008
      PATRONI_POSTGRESQL_PGPASS: /tmp/pgpass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farmer_db
    volumes:
      - pg-3-data:/var/lib/postgresql/data
    depends_on:
      - etcd-patroni
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    hostname: pgbouncer
    container_name: pgbouncer
    networks:
      - farmer-network
    ports:
      - "6432:5432"
    environment:
      DATABASE_URL: postgres://postgres:postgres@patroni-1:5432/farmer_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
    depends_on:
      - patroni-1
      - patroni-2
      - patroni-3
    restart: unless-stopped

  # ============================================================================
  # KEYCLOAK HA (Multi-instance with shared DB)
  # ============================================================================
  
  keycloak-db:
    image: postgres:16-alpine
    hostname: keycloak-db
    container_name: keycloak-db
    networks:
      - farmer-network
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak-1:
    image: quay.io/keycloak/keycloak:23.0
    hostname: keycloak-1
    container_name: keycloak-1
    networks:
      - farmer-network
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_CACHE: ispn
      KC_CACHE_STACK: kubernetes
    command: start-dev
    depends_on:
      - keycloak-db
    restart: unless-stopped

  keycloak-2:
    image: quay.io/keycloak/keycloak:23.0
    hostname: keycloak-2
    container_name: keycloak-2
    networks:
      - farmer-network
    ports:
      - "8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_CACHE: ispn
      KC_CACHE_STACK: kubernetes
    command: start-dev
    depends_on:
      - keycloak-db
    restart: unless-stopped

  # ============================================================================
  # PERMIFY HA (Multi-instance with Redis cache)
  # ============================================================================
  
  permify-1:
    image: ghcr.io/permify/permify:latest
    hostname: permify-1
    container_name: permify-1
    networks:
      - farmer-network
    ports:
      - "3476:3476"
      - "3478:3478"
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://postgres:postgres@patroni-1:5432/farmer_db?sslmode=disable
      PERMIFY_CACHE_ENGINE: redis
      PERMIFY_CACHE_URI: redis://redis-master-1:6379
      PERMIFY_LOG_LEVEL: info
    depends_on:
      - patroni-1
      - redis-master-1
    restart: unless-stopped

  permify-2:
    image: ghcr.io/permify/permify:latest
    hostname: permify-2
    container_name: permify-2
    networks:
      - farmer-network
    ports:
      - "3477:3476"
      - "3479:3478"
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://postgres:postgres@patroni-2:5432/farmer_db?sslmode=disable
      PERMIFY_CACHE_ENGINE: redis
      PERMIFY_CACHE_URI: redis://redis-master-1:6379
      PERMIFY_LOG_LEVEL: info
    depends_on:
      - patroni-2
      - redis-master-1
    restart: unless-stopped

  # ============================================================================
  # TEMPORAL HA (Multi-node with Cassandra backend)
  # ============================================================================
  
  cassandra-1:
    image: cassandra:4.1
    hostname: cassandra-1
    container_name: cassandra-1
    networks:
      - farmer-network
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: temporal-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1,cassandra-2
    volumes:
      - temporal-cassandra-1-data:/var/lib/cassandra
    restart: unless-stopped

  cassandra-2:
    image: cassandra:4.1
    hostname: cassandra-2
    container_name: cassandra-2
    networks:
      - farmer-network
    ports:
      - "9043:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: temporal-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack2
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1,cassandra-2
    volumes:
      - temporal-cassandra-2-data:/var/lib/cassandra
    depends_on:
      - cassandra-1
    restart: unless-stopped

  temporal-server-1:
    image: temporalio/auto-setup:1.22.4
    hostname: temporal-server-1
    container_name: temporal-server-1
    networks:
      - farmer-network
    ports:
      - "7233:7233"
    environment:
      DB: cassandra
      CASSANDRA_SEEDS: cassandra-1,cassandra-2
      CASSANDRA_CONSISTENCY: LOCAL_QUORUM
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
      ENABLE_ES: 'false'
      PROMETHEUS_ENDPOINT: 0.0.0.0:8000
    depends_on:
      - cassandra-1
      - cassandra-2
    restart: unless-stopped

  temporal-server-2:
    image: temporalio/auto-setup:1.22.4
    hostname: temporal-server-2
    container_name: temporal-server-2
    networks:
      - farmer-network
    ports:
      - "7234:7233"
    environment:
      DB: cassandra
      CASSANDRA_SEEDS: cassandra-1,cassandra-2
      CASSANDRA_CONSISTENCY: LOCAL_QUORUM
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
      ENABLE_ES: 'false'
      PROMETHEUS_ENDPOINT: 0.0.0.0:8000
      SKIP_DB_CREATE: 'true'
    depends_on:
      - cassandra-1
      - cassandra-2
      - temporal-server-1
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.21.3
    hostname: temporal-ui
    container_name: temporal-ui
    networks:
      - farmer-network
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal-server-1:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    depends_on:
      - temporal-server-1
    restart: unless-stopped

  # ============================================================================
  # APISIX HA (3-node cluster with etcd)
  # ============================================================================
  
  etcd-apisix-1:
    image: quay.io/coreos/etcd:v3.5.11
    hostname: etcd-apisix-1
    container_name: etcd-apisix-1
    networks:
      - farmer-network
    ports:
      - "2389:2379"
    environment:
      ETCD_NAME: etcd-apisix-1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-apisix-1:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-apisix-1:2379
      ETCD_INITIAL_CLUSTER: etcd-apisix-1=http://etcd-apisix-1:2380,etcd-apisix-2=http://etcd-apisix-2:2380,etcd-apisix-3=http://etcd-apisix-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: apisix-cluster
    volumes:
      - etcd-1-data:/etcd-data
    restart: unless-stopped

  etcd-apisix-2:
    image: quay.io/coreos/etcd:v3.5.11
    hostname: etcd-apisix-2
    container_name: etcd-apisix-2
    networks:
      - farmer-network
    ports:
      - "2390:2379"
    environment:
      ETCD_NAME: etcd-apisix-2
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-apisix-2:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-apisix-2:2379
      ETCD_INITIAL_CLUSTER: etcd-apisix-1=http://etcd-apisix-1:2380,etcd-apisix-2=http://etcd-apisix-2:2380,etcd-apisix-3=http://etcd-apisix-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: apisix-cluster
    volumes:
      - etcd-2-data:/etcd-data
    restart: unless-stopped

  etcd-apisix-3:
    image: quay.io/coreos/etcd:v3.5.11
    hostname: etcd-apisix-3
    container_name: etcd-apisix-3
    networks:
      - farmer-network
    ports:
      - "2391:2379"
    environment:
      ETCD_NAME: etcd-apisix-3
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-apisix-3:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-apisix-3:2379
      ETCD_INITIAL_CLUSTER: etcd-apisix-1=http://etcd-apisix-1:2380,etcd-apisix-2=http://etcd-apisix-2:2380,etcd-apisix-3=http://etcd-apisix-3:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: apisix-cluster
    volumes:
      - etcd-3-data:/etcd-data
    restart: unless-stopped

  apisix-1:
    image: apache/apisix:3.7.0-debian
    hostname: apisix-1
    container_name: apisix-1
    networks:
      - farmer-network
    ports:
      - "9080:9080"
      - "9180:9180"
      - "9443:9443"
    volumes:
      - ./infrastructure/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd-apisix-1
      - etcd-apisix-2
      - etcd-apisix-3
    restart: unless-stopped

  apisix-2:
    image: apache/apisix:3.7.0-debian
    hostname: apisix-2
    container_name: apisix-2
    networks:
      - farmer-network
    ports:
      - "9081:9080"
      - "9181:9180"
      - "9444:9443"
    volumes:
      - ./infrastructure/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd-apisix-1
      - etcd-apisix-2
      - etcd-apisix-3
    restart: unless-stopped

  apisix-3:
    image: apache/apisix:3.7.0-debian
    hostname: apisix-3
    container_name: apisix-3
    networks:
      - farmer-network
    ports:
      - "9082:9080"
      - "9182:9180"
      - "9445:9443"
    volumes:
      - ./infrastructure/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd-apisix-1
      - etcd-apisix-2
      - etcd-apisix-3
    restart: unless-stopped

  # ============================================================================
  # TIGERBEETLE HA (6-node cluster, 2 replicas per zone)
  # ============================================================================
  
  tigerbeetle-1:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.3
    hostname: tigerbeetle-1
    container_name: tigerbeetle-1
    networks:
      - farmer-network
    ports:
      - "3001:3000"
    command: start --addresses=tigerbeetle-1:3000,tigerbeetle-2:3000,tigerbeetle-3:3000,tigerbeetle-4:3000,tigerbeetle-5:3000,tigerbeetle-6:3000 --replica=0 /var/lib/tigerbeetle/data
    volumes:
      - tigerbeetle-1-data:/var/lib/tigerbeetle
    restart: unless-stopped

  tigerbeetle-2:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.3
    hostname: tigerbeetle-2
    container_name: tigerbeetle-2
    networks:
      - farmer-network
    ports:
      - "3002:3000"
    command: start --addresses=tigerbeetle-1:3000,tigerbeetle-2:3000,tigerbeetle-3:3000,tigerbeetle-4:3000,tigerbeetle-5:3000,tigerbeetle-6:3000 --replica=1 /var/lib/tigerbeetle/data
    volumes:
      - tigerbeetle-2-data:/var/lib/tigerbeetle
    restart: unless-stopped

  tigerbeetle-3:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.3
    hostname: tigerbeetle-3
    container_name: tigerbeetle-3
    networks:
      - farmer-network
    ports:
      - "3003:3000"
    command: start --addresses=tigerbeetle-1:3000,tigerbeetle-2:3000,tigerbeetle-3:3000,tigerbeetle-4:3000,tigerbeetle-5:3000,tigerbeetle-6:3000 --replica=2 /var/lib/tigerbeetle/data
    volumes:
      - tigerbeetle-3-data:/var/lib/tigerbeetle
    restart: unless-stopped

  tigerbeetle-4:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.3
    hostname: tigerbeetle-4
    container_name: tigerbeetle-4
    networks:
      - farmer-network
    ports:
      - "3004:3000"
    command: start --addresses=tigerbeetle-1:3000,tigerbeetle-2:3000,tigerbeetle-3:3000,tigerbeetle-4:3000,tigerbeetle-5:3000,tigerbeetle-6:3000 --replica=3 /var/lib/tigerbeetle/data
    volumes:
      - tigerbeetle-4-data:/var/lib/tigerbeetle
    restart: unless-stopped

  tigerbeetle-5:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.3
    hostname: tigerbeetle-5
    container_name: tigerbeetle-5
    networks:
      - farmer-network
    ports:
      - "3005:3000"
    command: start --addresses=tigerbeetle-1:3000,tigerbeetle-2:3000,tigerbeetle-3:3000,tigerbeetle-4:3000,tigerbeetle-5:3000,tigerbeetle-6:3000 --replica=4 /var/lib/tigerbeetle/data
    volumes:
      - tigerbeetle-5-data:/var/lib/tigerbeetle
    restart: unless-stopped

  tigerbeetle-6:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.15.3
    hostname: tigerbeetle-6
    container_name: tigerbeetle-6
    networks:
      - farmer-network
    ports:
      - "3006:3000"
    command: start --addresses=tigerbeetle-1:3000,tigerbeetle-2:3000,tigerbeetle-3:3000,tigerbeetle-4:3000,tigerbeetle-5:3000,tigerbeetle-6:3000 --replica=5 /var/lib/tigerbeetle/data
    volumes:
      - tigerbeetle-6-data:/var/lib/tigerbeetle
    restart: unless-stopped

  # ============================================================================
  # DAPR HA (Placement service + Sidecars)
  # ============================================================================
  
  dapr-placement:
    image: daprio/dapr:1.12.0
    hostname: dapr-placement
    container_name: dapr-placement
    networks:
      - farmer-network
    ports:
      - "50005:50005"
      - "8201:8201"
    command: ["./placement", "-port", "50005", "-log-level", "info"]
    restart: unless-stopped

  # ============================================================================
  # FLUVIO HA (3-node cluster with replication)
  # ============================================================================
  
  fluvio-sc:
    image: infinyon/fluvio:latest
    hostname: fluvio-sc
    container_name: fluvio-sc
    networks:
      - farmer-network
    ports:
      - "9003:9003"
    command: cluster start --sc
    environment:
      RUST_LOG: info
    restart: unless-stopped

  fluvio-spu-1:
    image: infinyon/fluvio:latest
    hostname: fluvio-spu-1
    container_name: fluvio-spu-1
    networks:
      - farmer-network
    ports:
      - "9010:9010"
    command: cluster start --spu --spu-id 0
    volumes:
      - fluvio-1-data:/var/lib/fluvio
    depends_on:
      - fluvio-sc
    restart: unless-stopped

  fluvio-spu-2:
    image: infinyon/fluvio:latest
    hostname: fluvio-spu-2
    container_name: fluvio-spu-2
    networks:
      - farmer-network
    ports:
      - "9011:9010"
    command: cluster start --spu --spu-id 1
    volumes:
      - fluvio-2-data:/var/lib/fluvio
    depends_on:
      - fluvio-sc
    restart: unless-stopped

  fluvio-spu-3:
    image: infinyon/fluvio:latest
    hostname: fluvio-spu-3
    container_name: fluvio-spu-3
    networks:
      - farmer-network
    ports:
      - "9012:9010"
    command: cluster start --spu --spu-id 2
    volumes:
      - fluvio-3-data:/var/lib/fluvio
    depends_on:
      - fluvio-sc
    restart: unless-stopped

  # ============================================================================
  # MINIO HA (4-node distributed mode for Data Lake)
  # ============================================================================
  
  minio-1:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    hostname: minio-1
    container_name: minio-1
    networks:
      - farmer-network
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DISTRIBUTED_MODE_ENABLED: 'yes'
      MINIO_DISTRIBUTED_NODES: http://minio-{1...4}:9000/data
    command: server http://minio-{1...4}:9000/data --console-address ":9001"
    volumes:
      - minio-1-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-2:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    hostname: minio-2
    container_name: minio-2
    networks:
      - farmer-network
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DISTRIBUTED_MODE_ENABLED: 'yes'
      MINIO_DISTRIBUTED_NODES: http://minio-{1...4}:9000/data
    command: server http://minio-{1...4}:9000/data --console-address ":9001"
    volumes:
      - minio-2-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-3:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    hostname: minio-3
    container_name: minio-3
    networks:
      - farmer-network
    ports:
      - "9004:9000"
      - "9005:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DISTRIBUTED_MODE_ENABLED: 'yes'
      MINIO_DISTRIBUTED_NODES: http://minio-{1...4}:9000/data
    command: server http://minio-{1...4}:9000/data --console-address ":9001"
    volumes:
      - minio-3-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-4:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    hostname: minio-4
    container_name: minio-4
    networks:
      - farmer-network
    ports:
      - "9006:9000"
      - "9007:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DISTRIBUTED_MODE_ENABLED: 'yes'
      MINIO_DISTRIBUTED_NODES: http://minio-{1...4}:9000/data
    command: server http://minio-{1...4}:9000/data --console-address ":9001"
    volumes:
      - minio-4-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================================================
  # TRINO HA (Query engine for Data Lake)
  # ============================================================================
  
  trino-coordinator:
    image: trinodb/trino:435
    hostname: trino-coordinator
    container_name: trino-coordinator
    networks:
      - farmer-network
    ports:
      - "8082:8080"
    environment:
      TRINO_ENVIRONMENT: production
    volumes:
      - ./infrastructure/lakehouse/trino-coordinator.properties:/etc/trino/config.properties:ro
      - ./infrastructure/lakehouse/catalog:/etc/trino/catalog:ro
    depends_on:
      - minio-1
      - minio-2
      - minio-3
      - minio-4
    restart: unless-stopped

  trino-worker-1:
    image: trinodb/trino:435
    hostname: trino-worker-1
    container_name: trino-worker-1
    networks:
      - farmer-network
    environment:
      TRINO_ENVIRONMENT: production
    volumes:
      - ./infrastructure/lakehouse/trino-worker.properties:/etc/trino/config.properties:ro
      - ./infrastructure/lakehouse/catalog:/etc/trino/catalog:ro
    depends_on:
      - trino-coordinator
    restart: unless-stopped

  trino-worker-2:
    image: trinodb/trino:435
    hostname: trino-worker-2
    container_name: trino-worker-2
    networks:
      - farmer-network
    environment:
      TRINO_ENVIRONMENT: production
    volumes:
      - ./infrastructure/lakehouse/trino-worker.properties:/etc/trino/config.properties:ro
      - ./infrastructure/lakehouse/catalog:/etc/trino/catalog:ro
    depends_on:
      - trino-coordinator
    restart: unless-stopped

  # ============================================================================
  # OPENAPPSEC HA (Multi-instance WAF)
  # ============================================================================
  
  openappsec-1:
    image: ghcr.io/openappsec/agent:latest
    hostname: openappsec-1
    container_name: openappsec-1
    networks:
      - farmer-network
    ports:
      - "8443:443"
    environment:
      OPENAPPSEC_MODE: prevention
      OPENAPPSEC_LOG_LEVEL: info
    restart: unless-stopped

  openappsec-2:
    image: ghcr.io/openappsec/agent:latest
    hostname: openappsec-2
    container_name: openappsec-2
    networks:
      - farmer-network
    ports:
      - "8444:443"
    environment:
      OPENAPPSEC_MODE: prevention
      OPENAPPSEC_LOG_LEVEL: info
    restart: unless-stopped

  # ============================================================================
  # MONITORING STACK (Prometheus, Grafana, Loki, Tempo)
  # ============================================================================
  
  prometheus:
    image: prom/prometheus:v2.48.1
    hostname: prometheus
    container_name: prometheus
    networks:
      - farmer-network
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    hostname: grafana
    container_name: grafana
    networks:
      - farmer-network
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.3
    hostname: loki
    container_name: loki
    networks:
      - farmer-network
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.3
    hostname: promtail
    container_name: promtail
    networks:
      - farmer-network
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infrastructure/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.3.1
    hostname: tempo
    container_name: tempo
    networks:
      - farmer-network
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./infrastructure/monitoring/tempo.yaml:/etc/tempo.yaml:ro
    restart: unless-stopped

  # ============================================================================
  # ALERTMANAGER
  # ============================================================================
  
  alertmanager:
    image: prom/alertmanager:v0.26.0
    hostname: alertmanager
    container_name: alertmanager
    networks:
      - farmer-network
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
