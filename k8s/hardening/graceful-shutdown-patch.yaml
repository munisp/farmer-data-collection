# Graceful Shutdown Configuration for FarmConnect Platform
# Applied as a strategic merge patch via Kustomize
#
# This ensures:
# 1. terminationGracePeriodSeconds allows in-flight requests to complete
# 2. preStop hooks provide connection draining time before SIGTERM
# 3. K8s + KEDA + application-level shutdown work together seamlessly
#
# Restart Flow:
#   1. K8s sends SIGTERM to pod
#   2. preStop hook runs (sleep 5s for connection draining)
#   3. Application handles SIGTERM (graceful shutdown in Go/Rust/Python)
#   4. If still running after terminationGracePeriodSeconds, SIGKILL
#   5. KEDA/HPA creates replacement pod based on scaling triggers
#   6. New pod starts, passes readiness probe, receives traffic

---
# API Server — critical path, longest drain period
apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmconnect-api
  namespace: farmconnect
spec:
  template:
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: farmconnect-api
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

