# PodDisruptionBudgets for FarmConnect Platform
# Ensures minimum availability during voluntary disruptions (upgrades, drains)
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: farmconnect-api-pdb
  namespace: farmconnect
  labels:
    app.kubernetes.io/part-of: farmconnect
    app.kubernetes.io/component: api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: farmconnect-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: delivery-service-pdb
  namespace: farmconnect
