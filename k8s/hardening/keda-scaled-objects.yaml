# ============================================================================
# 6. Batch/Cron ScaledJobs — scheduled scaling for periodic workloads
# ============================================================================
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: loan-worker-keda
  namespace: farmconnect
  labels:
    app: loan-worker
    tier: python-batch
spec:
  scaleTargetRef:
    name: loan-worker
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.farmconnect.svc.cluster.local:9092
        consumerGroup: loan-worker-consumer
        topic: farmconnect.loan-applications
        lagThreshold: "5"
        activationLagThreshold: "1"
      authenticationRef:
        name: kafka-trigger-auth
    - type: cron
      metadata:
        timezone: Africa/Nairobi
        start: 0 6 * * *
        end: 0 22 * * *
        desiredReplicas: "2"

