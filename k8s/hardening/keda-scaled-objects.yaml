# KEDA ScaledObjects for FarmConnect Platform
# Event-driven autoscaling based on Kafka consumer lag, HTTP request rate,
# and scheduled scaling for batch workloads.
#
# Prerequisites:
#   - KEDA operator installed: helm install keda kedacore/keda --namespace keda-system
#   - TriggerAuthentication for Kafka broker credentials
#   - Prometheus adapter for HTTP metrics
---
# TriggerAuthentication — shared Kafka credentials
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: kafka-trigger-auth
  namespace: farmconnect
spec:
  secretTargetRef:
    - parameter: sasl
      name: kafka-credentials
      key: sasl-mechanism
    - parameter: username
      name: kafka-credentials
      key: username
    - parameter: password
      name: kafka-credentials
      key: password
    - parameter: tls
      name: kafka-credentials
      key: tls-enabled

---
# TriggerAuthentication — Prometheus for HTTP metrics
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: prometheus-trigger-auth
  namespace: farmconnect
spec:
  secretTargetRef: []

# ============================================================================
# 1. API Server — HTTP request rate + Kafka consumer lag
# ============================================================================
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: farmconnect-api-keda
  namespace: farmconnect
  labels:
    app: farmconnect-api
    tier: api
spec:
  scaleTargetRef:
    name: farmconnect-api
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 3
  maxReplicaCount: 25
  fallback:
    failureThreshold: 3
    replicas: 5
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:9090
        metricName: http_requests_total
        query: sum(rate(http_requests_total{app="farmconnect-api"}[2m]))
        threshold: "100"
        activationThreshold: "20"
      authenticationRef:
        name: prometheus-trigger-auth
    - type: kafka
      metadata:
        bootstrapServers: kafka.farmconnect.svc.cluster.local:9092
        consumerGroup: farmconnect-api-group
        topic: farmconnect.events
        lagThreshold: "50"
        activationLagThreshold: "10"
        offsetResetPolicy: latest
      authenticationRef:
        name: kafka-trigger-auth
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
    - type: memory
      metricType: Utilization
      metadata:
        value: "80"
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 50
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 120

