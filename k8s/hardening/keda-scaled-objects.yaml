    name: urban-delivery-rust
  pollingInterval: 10
  cooldownPeriod: 120
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:9090
        metricName: urban_delivery_p99_latency
        query: histogram_quantile(0.99, sum(rate(grpc_server_handling_seconds_bucket{grpc_service="UrbanDeliveryService"}[5m])) by (le))
        threshold: "2"
      authenticationRef:
