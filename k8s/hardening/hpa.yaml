# Horizontal Pod Autoscalers for FarmConnect
# Auto-scales services based on CPU/memory utilization and custom metrics
---
# 1. Main API Server — scales 3-20 pods
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: farmconnect-api-hpa
  namespace: farmconnect
  labels:
    app: farmconnect-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: farmconnect-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 3
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120

