## Go Microservices
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flags
  namespace: farmconnect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feature-flags
  template:
    metadata:
      labels:
        app: feature-flags
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "feature-flags"
        dapr.io/app-port: "8101"
    spec:
      containers:
        - name: feature-flags
          image: farmconnect/feature-flags:latest
          ports:
            - containerPort: 8101
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8101
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: feature-flags
  namespace: farmconnect
spec:
  selector:
    app: feature-flags
  ports:
    - port: 8101
      targetPort: 8101
