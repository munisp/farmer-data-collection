## ============================================================================
## Polyglot Services — Python (ML/AI)
## ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cea-ai-python
  namespace: farmconnect
  labels:
    tier: polyglot
    language: python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cea-ai-python
  template:
    metadata:
      labels:
        app: cea-ai-python
        tier: polyglot
        language: python
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8112"
    spec:
      containers:
        - name: cea-ai
          image: farmconnect/cea-ai-python:latest
          ports:
            - containerPort: 8112
              name: http
            - containerPort: 9112
              name: grpc
          env:
            - name: HTTP_PORT
              value: "8112"
            - name: GRPC_PORT
              value: "9112"
          envFrom:
            - configMapRef:
                name: farmconnect-config
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8112
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: ml-models
              mountPath: /models
      volumes:
        - name: ml-models
          persistentVolumeClaim:
            claimName: ml-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cea-ai-python
  namespace: farmconnect
spec:
  selector:
