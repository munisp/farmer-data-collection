## ============================================================================
## Polyglot Services — Go
## ============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-provenance-go
  namespace: farmconnect
  labels:
    tier: polyglot
    language: go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blockchain-provenance-go
  template:
    metadata:
      labels:
        app: blockchain-provenance-go
        tier: polyglot
        language: go
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8110"
    spec:
      containers:
        - name: blockchain-provenance
          image: farmconnect/blockchain-provenance-go:latest
          ports:
            - containerPort: 8110
              name: http
            - containerPort: 9110
              name: grpc
          env:
            - name: HTTP_PORT
              value: "8110"
            - name: GRPC_PORT
              value: "9110"
          envFrom:
            - configMapRef:
                name: farmconnect-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8110
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8110
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: blockchain-provenance-go
  namespace: farmconnect
spec:
  selector:
    app: blockchain-provenance-go
  ports:
    - name: http
      port: 8110
      targetPort: 8110
    - name: grpc
      port: 9110
      targetPort: 9110
