## Rust Microservices
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-proxy
  namespace: farmconnect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-proxy
  template:
    metadata:
      labels:
        app: search-proxy
    spec:
      containers:
        - name: search
          image: farmconnect/search-proxy:latest
          ports:
            - containerPort: 8104
          env:
            - name: OPENSEARCH_URL
              value: http://opensearch:9200
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: search-proxy
  namespace: farmconnect
spec:
  selector:
    app: search-proxy
  ports:
    - port: 8104
      targetPort: 8104
