apiVersion: apps/v1
kind: Deployment
metadata:
  name: farmconnect-app
  namespace: farmconnect
  labels:
    app: farmconnect-app
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: farmconnect-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: farmconnect-app
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
        dapr.io/enabled: "true"
        dapr.io/app-id: "farmconnect-app"
        dapr.io/app-port: "3001"
    spec:
      containers:
        - name: app
          image: farmconnect/app:latest
          ports:
            - containerPort: 3000
              name: http-client
            - containerPort: 3001
              name: http-api
          envFrom:
            - secretRef:
                name: farmconnect-secrets
            - configMapRef:
                name: farmconnect-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: farmconnect-app
  namespace: farmconnect
spec:
  type: ClusterIP
  selector:
    app: farmconnect-app
  ports:
    - name: http-client
      port: 3000
      targetPort: 3000
    - name: http-api
      port: 3001
      targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: farmconnect-app
  namespace: farmconnect
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: farmconnect-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
