# ExternalSecrets — Syncs secrets from AWS Secrets Manager to K8s Secrets
# Requires: external-secrets operator installed in the cluster
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-store
  namespace: farmconnect
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
# Core application secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: farmconnect-secrets
  namespace: farmconnect
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: farmconnect-secrets
    creationPolicy: Owner
  data:
    # Database
    - secretKey: DATABASE_URL
      remoteRef:
        key: farmconnect/production/database
        property: url
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: farmconnect/production/database
        property: password

    # Redis
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: farmconnect/production/redis
        property: password

    # JWT
    - secretKey: JWT_SECRET
      remoteRef:
        key: farmconnect/production/auth
        property: jwt_secret

    # Keycloak
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: farmconnect/production/keycloak
        property: client_secret
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: farmconnect/production/keycloak
        property: admin_password

    # Kafka
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef:
        key: farmconnect/production/kafka
        property: sasl_password

    # External APIs
    - secretKey: OPENWEATHER_API_KEY
      remoteRef:
        key: farmconnect/production/external-apis
        property: openweather_api_key
    - secretKey: EXCHANGE_RATE_API_KEY
      remoteRef:
        key: farmconnect/production/external-apis
        property: exchange_rate_api_key

    # Payment providers
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: farmconnect/production/payments
        property: stripe_secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: farmconnect/production/payments
        property: stripe_webhook_secret
    - secretKey: PAYSTACK_SECRET_KEY
      remoteRef:
        key: farmconnect/production/payments
        property: paystack_secret_key

    # Communication
    - secretKey: AFRICASTALKING_API_KEY
      remoteRef:
        key: farmconnect/production/communication
        property: africastalking_api_key
    - secretKey: META_WHATSAPP_ACCESS_TOKEN
      remoteRef:
        key: farmconnect/production/communication
        property: whatsapp_access_token

    # SMTP
    - secretKey: SMTP_PASS
      remoteRef:
        key: farmconnect/production/smtp
        property: password

    # Observability
    - secretKey: SENTRY_DSN
      remoteRef:
        key: farmconnect/production/observability
        property: sentry_dsn

    # Alerting
    - secretKey: PAGERDUTY_ROUTING_KEY
      remoteRef:
        key: farmconnect/production/alerting
        property: pagerduty_routing_key
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: farmconnect/production/alerting
        property: slack_webhook_url

---
# PostgreSQL secret (for StatefulSet)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: farmconnect
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: farmconnect/production/database
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: farmconnect/production/database
        property: password

---
# mTLS certificates
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grpc-mtls-certs
  namespace: farmconnect
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-store
    kind: SecretStore
  target:
    name: grpc-mtls-certs
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: farmconnect/production/mtls
        property: ca_cert
    - secretKey: tls.crt
      remoteRef:
        key: farmconnect/production/mtls
        property: server_cert
    - secretKey: tls.key
      remoteRef:
        key: farmconnect/production/mtls
        property: server_key
