# Prometheus Scrape Configuration for FarmConnect
# Deploys as a ConfigMap referenced by the Prometheus StatefulSet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: farmconnect
  labels:
    app: farmconnect
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      # ================================================================
      # 1. Prometheus self-monitoring
      # ================================================================
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      # ================================================================
      # 2. FarmConnect API Server (TypeScript / Node.js)
      # ================================================================
      - job_name: "farmconnect-api"
        metrics_path: /metrics
        scrape_interval: 10s
        static_configs:
          - targets: ["farmconnect-api:3001"]
            labels:
              service: farmconnect-api
              tier: api
              language: typescript

      # ================================================================
      # 3. Go Microservices
      # ================================================================
      - job_name: "go-services"
        metrics_path: /metrics
        scrape_interval: 15s
        static_configs:
          - targets: ["feature-flags:8101"]
            labels:
              service: feature-flags
              language: go
          - targets: ["whatsapp-service:8102"]
            labels:
              service: whatsapp-service
              language: go
          - targets: ["qr-traceability:8103"]
            labels:
              service: qr-traceability
              language: go
          - targets: ["tile-cache:8097"]
            labels:
              service: tile-cache
              language: go
          - targets: ["gps-streaming:8096"]
            labels:
              service: gps-streaming
              language: go
          - targets: ["blockchain-provenance-go:8110"]
            labels:
              service: blockchain-provenance
              language: go
          - targets: ["aquaculture-pond-go:8113"]
            labels:
              service: aquaculture-pond
              language: go
          - targets: ["contract-farming-go:8116"]
            labels:
              service: contract-farming
              language: go
          - targets: ["equipment-fleet-go:8098"]
            labels:
              service: equipment-fleet
              language: go

      # ================================================================
      # 4. Rust Microservices
      # ================================================================
      - job_name: "rust-services"
        metrics_path: /metrics
        scrape_interval: 15s
        static_configs:
          - targets: ["spatial-query-service:8099"]
            labels:
              service: spatial-query
              language: rust
          - targets: ["urban-delivery-rust:8111"]
            labels:
              service: urban-delivery
              language: rust
          - targets: ["aquaculture-feed-rust:8114"]
            labels:
              service: aquaculture-feed
              language: rust
          - targets: ["warehouse-receipt-rust:8117"]
            labels:
              service: warehouse-receipt
              language: rust

      # ================================================================
      # 5. Python Microservices
      # ================================================================
      - job_name: "python-services"
        metrics_path: /metrics
        scrape_interval: 15s
        static_configs:
          - targets: ["geocoding:8100"]
            labels:
              service: geocoding
              language: python
          - targets: ["weather-alerts:8107"]
            labels:
              service: weather-alerts
              language: python
          - targets: ["credit-scoring:8108"]
            labels:
              service: credit-scoring
              language: python
          - targets: ["voice-navigation:8109"]
            labels:
              service: voice-navigation
              language: python
          - targets: ["cea-ai-python:8112"]
            labels:
              service: cea-ai
              language: python
          - targets: ["aquaculture-ai-python:8115"]
            labels:
              service: aquaculture-ai
              language: python
          - targets: ["conversational-commerce-python:8118"]
            labels:
              service: conversational-commerce
              language: python

      # ================================================================
      # 6. gRPC Services (via gRPC health probe exporter)
      # ================================================================
      - job_name: "grpc-services"
        metrics_path: /probe
        params:
          module: [grpc]
        static_configs:
          - targets:
              - "farmconnect-api:9090"
              - "farmconnect-api:9091"
              - "farmconnect-api:9092"
              - "farmconnect-api:9093"
              - "farmconnect-api:9094"
              - "farmconnect-api:9095"
              - "farmconnect-api:9096"
              - "farmconnect-api:9097"
              - "farmconnect-api:9098"
              - "blockchain-provenance-go:9110"
              - "urban-delivery-rust:9111"
              - "cea-ai-python:9112"
              - "aquaculture-pond-go:9113"
              - "aquaculture-feed-rust:9114"
              - "aquaculture-ai-python:9115"
              - "contract-farming-go:9116"
              - "warehouse-receipt-rust:9117"
              - "conversational-commerce-python:9118"
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: grpc-health-exporter:9115

      # ================================================================
      # 7. Infrastructure — PostgreSQL
      # ================================================================
      - job_name: "postgres"
        static_configs:
          - targets: ["postgres-exporter:9187"]
            labels:
              service: postgresql

      # ================================================================
      # 8. Infrastructure — Redis
      # ================================================================
      - job_name: "redis"
        static_configs:
          - targets: ["redis-exporter:9121"]
            labels:
              service: redis

      # ================================================================
      # 9. Infrastructure — Kafka
      # ================================================================
      - job_name: "kafka"
        static_configs:
          - targets: ["kafka-exporter:9308"]
            labels:
              service: kafka

      # ================================================================
      # 10. Infrastructure — OpenSearch
      # ================================================================
      - job_name: "opensearch"
        metrics_path: /_prometheus/metrics
        static_configs:
          - targets: ["opensearch:9200"]
            labels:
              service: opensearch

      # ================================================================
      # 11. Infrastructure — TigerBeetle
      # ================================================================
      - job_name: "tigerbeetle"
        metrics_path: /probe
        params:
          module: [tcp_connect]
        static_configs:
          - targets: ["tigerbeetle:3000"]
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - target_label: __address__
            replacement: blackbox-exporter:9115

      # ================================================================
      # 12. Infrastructure — Keycloak
      # ================================================================
      - job_name: "keycloak"
        metrics_path: /metrics
        static_configs:
          - targets: ["keycloak:8080"]
            labels:
              service: keycloak

      # ================================================================
      # 13. Kubernetes — Node Exporter
      # ================================================================
      - job_name: "node-exporter"
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: "(.*):10250"
            replacement: "$1:9100"
            target_label: __address__

      # ================================================================
      # 14. Kubernetes — kube-state-metrics
      # ================================================================
      - job_name: "kube-state-metrics"
        static_configs:
          - targets: ["kube-state-metrics:8080"]

      # ================================================================
      # 15. Kubernetes — Pod auto-discovery
      # ================================================================
      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["farmconnect"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
