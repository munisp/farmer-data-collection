# OpenTelemetry Collector Configuration for FarmConnect
# Receives traces/metrics from all services and exports to Jaeger + Prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: farmconnect
  labels:
    app: farmconnect
    component: observability
data:
  otel-collector-config.yaml: |
    receivers:
      # OTLP receiver — accepts traces and metrics from all services
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - "https://farmconnect.app"
                - "http://localhost:3001"

      # Prometheus receiver — scrape polyglot service metrics
      prometheus:
        config:
          scrape_configs:
            - job_name: "otel-collector"
              scrape_interval: 15s
              static_configs:
                - targets: ["localhost:8888"]

      # Host metrics (node-level CPU, memory, disk)
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          network: {}

    processors:
      # Batch processor — reduces exporter load
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048

      # Memory limiter — prevents OOM
      memory_limiter:
        check_interval: 5s
        limit_mib: 512
        spike_limit_mib: 128

      # Resource processor — enrich spans with cluster info
      resource:
        attributes:
          - key: deployment.environment
            value: production
            action: upsert
          - key: service.namespace
            value: farmconnect
            action: upsert
          - key: cluster.name
            value: farmconnect-production
            action: upsert

      # Attributes processor — redact sensitive data from spans
      attributes:
        actions:
          - key: db.statement
            action: hash
          - key: http.request.header.authorization
            action: delete
          - key: db.connection_string
            action: delete

      # Tail sampling — keep 100% of errors, 10% of normal traces
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 100
        policies:
          - name: errors-policy
            type: status_code
            status_code:
              status_codes:
                - ERROR
          - name: latency-policy
            type: latency
            latency:
              threshold_ms: 2000
          - name: probabilistic-policy
            type: probabilistic
            probabilistic:
              sampling_percentage: 10

    exporters:
      # Jaeger exporter — distributed tracing
      otlp/jaeger:
        endpoint: jaeger-collector:4317
        tls:
          insecure: true

      # Prometheus exporter — metrics
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: farmconnect
        resource_to_telemetry_conversion:
          enabled: true

      # Logging exporter — debug (disabled in production)
      logging:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200

    extensions:
      # Health check
      health_check:
        endpoint: 0.0.0.0:13133

      # Performance profiling
      pprof:
        endpoint: 0.0.0.0:1777

      # zPages for debugging
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, attributes, tail_sampling, batch]
          exporters: [otlp/jaeger, logging]
        metrics:
          receivers: [otlp, prometheus, hostmetrics]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus]

---
# OTel Collector Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: farmconnect
  labels:
    app: otel-collector
    component: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        component: observability
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          args:
            - --config=/etc/otel-collector/otel-collector-config.yaml
          ports:
            - containerPort: 4317   # OTLP gRPC
              name: otlp-grpc
            - containerPort: 4318   # OTLP HTTP
              name: otlp-http
            - containerPort: 8889   # Prometheus metrics
              name: prometheus
            - containerPort: 13133  # Health check
              name: health
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector
      volumes:
        - name: config
          configMap:
            name: otel-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: farmconnect
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: prometheus
      port: 8889
      targetPort: 8889
    - name: health
      port: 13133
      targetPort: 13133
