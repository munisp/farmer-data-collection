apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iot-service
  template:
    metadata:
      labels:
        app: iot-service
    spec:
      containers:
      - name: iot-service
        image: farmer-data-collection/iot-service:latest
        ports:
        - containerPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: satellite-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: satellite-service
  template:
    metadata:
      labels:
        app: satellite-service
    spec:
      containers:
      - name: satellite-service
        image: farmer-data-collection/satellite-service:latest
        ports:
        - containerPort: 8091
