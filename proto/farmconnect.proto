}

message WaterQualityReading {
  string pond_id = 1;
  double temperature_c = 2;
  double ph = 3;
  double dissolved_oxygen_mg_l = 4;
  double ammonia_mg_l = 5;
  double nitrite_mg_l = 6;
  double nitrate_mg_l = 7;
  double turbidity_ntu = 8;
  double salinity_ppt = 9;
  int64 timestamp = 10;
}

message WaterQualityResponse {
  bool within_range = 1;
  double quality_index = 2;
