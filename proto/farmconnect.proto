message PondListRequest {
  string farm_id = 1;
  string pond_type = 2;
}

message PondListResponse {
  repeated PondSummary ponds = 1;
  int32 total = 2;
}

message PondSummary {
  string pond_id = 1;
  string name = 2;
  string type = 3;
  double area_sqm = 4;
  double depth_m = 5;
  string species = 6;
  int32 stock_count = 7;
  double water_quality_index = 8;
}

message PondStatusRequest {
  string pond_id = 1;
}

message PondStatus {
  string pond_id = 1;
  string name = 2;
  double temperature_c = 3;
  double ph = 4;
  double dissolved_oxygen_mg_l = 5;
  double ammonia_mg_l = 6;
  double turbidity_ntu = 7;
  int32 fish_count = 8;
  double avg_weight_g = 9;
