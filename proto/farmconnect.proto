message WaterQualityHistoryRequest {
  string pond_id = 1;
  int32 days = 2;
}

message WaterQualityHistory {
  repeated WaterQualitySnapshot snapshots = 1;
  double avg_quality_index = 2;
}

message WaterQualitySnapshot {
  int64 timestamp = 1;
  double temperature_c = 2;
  double ph = 3;
  double dissolved_oxygen_mg_l = 4;
  double quality_index = 5;
}

message CreatePondRequest {
  string farm_id = 1;
  string name = 2;
  string type = 3;
  double area_sqm = 4;
  double depth_m = 5;
  string species = 6;
  int32 initial_stock = 7;
}

message CreatePondResponse {
  bool success = 1;
  string pond_id = 2;
}

// ===== Aquaculture Feed Service (Rust :8114) =====

service AquacultureFeedService {
  rpc GetFeedSchedule(FeedScheduleRequest) returns (FeedSchedule);
  rpc RecordFeeding(FeedingRecord) returns (FeedingRecordResponse);
  rpc CalculateFCR(FCRRequest) returns (FCRResponse);
  rpc GetFeedInventory(FeedInventoryRequest) returns (FeedInventory);
  rpc OptimizeFeedPlan(FeedOptimizeRequest) returns (FeedOptimizeResponse);
}

message FeedScheduleRequest {
  string pond_id = 1;
  string species = 2;
}

message FeedSchedule {
  string pond_id = 1;
  repeated FeedingSlot slots = 2;
  double daily_total_kg = 3;
}

message FeedingSlot {
  string time = 1;
  double amount_kg = 2;
  string feed_type = 3;
  double protein_pct = 4;
}

message FeedingRecord {
  string pond_id = 1;
  string feed_type = 2;
  double amount_kg = 3;
  double water_temp_c = 4;
  string observer_notes = 5;
  int64 timestamp = 6;
}

message FeedingRecordResponse {
  bool success = 1;
  string record_id = 2;
  double cumulative_today_kg = 3;
}

message FCRRequest {
  string pond_id = 1;
  int32 period_days = 2;
}

message FCRResponse {
  double fcr = 1;
  double feed_consumed_kg = 2;
  double weight_gained_kg = 3;
  string rating = 4;
  double cost_per_kg_gain = 5;
}

message FeedInventoryRequest {
  string farm_id = 1;
}

message FeedInventory {
  repeated FeedStock stocks = 1;
  int32 days_supply_remaining = 2;
  double total_value = 3;
}

message FeedStock {
  string feed_type = 1;
  double quantity_kg = 2;
  double price_per_kg = 3;
  string expiry_date = 4;
  double protein_pct = 5;
}

message FeedOptimizeRequest {
  string pond_id = 1;
  string species = 2;
  double current_avg_weight_g = 3;
  double target_weight_g = 4;
  int32 days_remaining = 5;
}

message FeedOptimizeResponse {
  double recommended_daily_kg = 1;
  string recommended_feed_type = 2;
  double expected_fcr = 3;
  double estimated_cost = 4;
  repeated string adjustments = 5;
}

// ===== Aquaculture AI Service (Python :8115) =====

service AquacultureAIService {
  rpc DiagnoseFishDisease(FishDiseaseRequest) returns (FishDiseaseResponse);
  rpc PredictGrowth(FishGrowthRequest) returns (FishGrowthResponse);
  rpc OptimalConditions(OptimalConditionsRequest) returns (OptimalConditionsResponse);
  rpc EstimateHatchery(HatcheryRequest) returns (HatcheryResponse);
  rpc PredictMortality(MortalityRequest) returns (MortalityResponse);
}

message FishDiseaseRequest {
  string species = 1;
  repeated string symptoms = 2;
  double water_temp_c = 3;
  double ph = 4;
  double dissolved_oxygen_mg_l = 5;
}

message FishDiseaseResponse {
  string disease = 1;
  double confidence = 2;
  string category = 3;
  string treatment = 4;
  repeated string preventive_measures = 5;
  int32 recovery_days = 6;
}

message FishGrowthRequest {
  string species = 1;
  double current_weight_g = 2;
  int32 age_days = 3;
  double water_temp_c = 4;
  double feed_rate_pct = 5;
}

message FishGrowthResponse {
  double predicted_weight_g = 1;
  int32 days_to_market = 2;
  double growth_rate_g_day = 3;
  double confidence = 4;
  string model = 5;
}

message OptimalConditionsRequest {
  string species = 1;
  string life_stage = 2;
}

message OptimalConditionsResponse {
  double temp_min_c = 1;
  double temp_max_c = 2;
  double ph_min = 3;
  double ph_max = 4;
  double do_min_mg_l = 5;
  double ammonia_max_mg_l = 6;
  double salinity_min_ppt = 7;
  double salinity_max_ppt = 8;
  double feed_rate_pct = 9;
  double stocking_density_per_sqm = 10;
}

message HatcheryRequest {
  string species = 1;
  int32 broodstock_count = 2;
  double avg_weight_kg = 3;
}

message HatcheryResponse {
  int32 estimated_eggs = 1;
  int32 estimated_fry = 2;
  double survival_rate_pct = 3;
  int32 incubation_days = 4;
  double estimated_cost = 5;
}

message MortalityRequest {
  string species = 1;
  double water_temp_c = 2;
  double dissolved_oxygen_mg_l = 3;
  double ammonia_mg_l = 4;
  int32 stocking_density = 5;
  int32 age_days = 6;
}

message MortalityResponse {
  double mortality_rate_pct = 1;
  string risk_level = 2;
  repeated string risk_factors = 3;
  repeated string mitigation_actions = 4;
}

// ===== Contract Farming Service (Go :8116) =====

service ContractFarmingService {
  rpc CreateContract(ContractCreateRequest) returns (ContractCreateResponse);
  rpc ListContracts(ContractListRequest) returns (ContractListResponse);
  rpc GetContractPerformance(ContractPerformanceRequest) returns (ContractPerformance);
  rpc RecordDelivery(ContractDeliveryRecord) returns (ContractDeliveryResponse);
  rpc EvaluateOfftaker(OfftakerEvalRequest) returns (OfftakerEvalResponse);
}

message ContractCreateRequest {
  string farmer_id = 1;
  string offtaker_id = 2;
  string commodity = 3;
  double quantity_kg = 4;
  double price_per_kg = 5;
  string delivery_schedule = 6;
  int64 start_date = 7;
  int64 end_date = 8;
  string quality_requirements = 9;
}

message ContractCreateResponse {
  bool success = 1;
  string contract_id = 2;
  string status = 3;
}

message ContractListRequest {
  string farmer_id = 1;
  string offtaker_id = 2;
  string status = 3;
}

message ContractListResponse {
  repeated ContractSummary contracts = 1;
  int32 total = 2;
}

message ContractSummary {
  string contract_id = 1;
  string farmer_name = 2;
  string offtaker_name = 3;
  string commodity = 4;
  double quantity_kg = 5;
  double price_per_kg = 6;
  string status = 7;
  double fulfillment_pct = 8;
}

message ContractPerformanceRequest {
  string contract_id = 1;
}

message ContractPerformance {
  string contract_id = 1;
  double delivered_kg = 2;
  double target_kg = 3;
  double fulfillment_pct = 4;
  int32 on_time_deliveries = 5;
  int32 total_deliveries = 6;
  double avg_quality_score = 7;
  double total_paid = 8;
}

message ContractDeliveryRecord {
  string contract_id = 1;
  double quantity_kg = 2;
  string quality_grade = 3;
  double moisture_pct = 4;
  int64 delivery_date = 5;
}

message ContractDeliveryResponse {
  bool success = 1;
  string delivery_id = 2;
  double remaining_kg = 3;
  double amount_payable = 4;
}

message OfftakerEvalRequest {
  string offtaker_id = 1;
}

message OfftakerEvalResponse {
  string offtaker_id = 1;
  double reliability_score = 2;
  double avg_payment_days = 3;
  int32 contracts_completed = 4;
  int32 contracts_defaulted = 5;
  string rating = 6;
}

// ===== Warehouse Receipt Service (Rust :8117) =====

service WarehouseReceiptService {
  rpc IssueReceipt(ReceiptIssueRequest) returns (ReceiptIssueResponse);
  rpc GetReceipt(ReceiptGetRequest) returns (WarehouseReceipt);
  rpc TransferReceipt(ReceiptTransferRequest) returns (ReceiptTransferResponse);
  rpc PledgeAsCollateral(CollateralPledgeRequest) returns (CollateralPledgeResponse);
  rpc GetWarehouseInventory(WarehouseInventoryRequest) returns (WarehouseInventory);
}

message ReceiptIssueRequest {
  string warehouse_id = 1;
  string depositor_id = 2;
  string commodity = 3;
  double quantity_kg = 4;
  string quality_grade = 5;
  double moisture_pct = 6;
  int64 storage_date = 7;
}

message ReceiptIssueResponse {
  bool success = 1;
  string receipt_id = 2;
  string receipt_number = 3;
  int64 expiry_date = 4;
}

message ReceiptGetRequest {
  string receipt_id = 1;
}

message WarehouseReceipt {
  string receipt_id = 1;
  string receipt_number = 2;
  string warehouse_id = 3;
  string warehouse_name = 4;
  string depositor_id = 5;
  string commodity = 6;
  double quantity_kg = 7;
  string quality_grade = 8;
  double current_value = 9;
  string status = 10;
  bool is_pledged = 11;
  int64 storage_date = 12;
  int64 expiry_date = 13;
}

message ReceiptTransferRequest {
  string receipt_id = 1;
  string from_holder = 2;
  string to_holder = 3;
  string reason = 4;
}

message ReceiptTransferResponse {
  bool success = 1;
  string transfer_id = 2;
  string new_holder = 3;
}

message CollateralPledgeRequest {
  string receipt_id = 1;
  string lender_id = 2;
  double loan_amount = 3;
  string currency = 4;
  double ltv_ratio = 5;
}

message CollateralPledgeResponse {
  bool success = 1;
  string pledge_id = 2;
  double approved_amount = 3;
  double interest_rate_pct = 4;
  int64 maturity_date = 5;
}

message WarehouseInventoryRequest {
  string warehouse_id = 1;
}

message WarehouseInventory {
  string warehouse_id = 1;
  string name = 2;
  double capacity_mt = 3;
  double used_mt = 4;
  double utilization_pct = 5;
  repeated CommodityStock stocks = 6;
}

message CommodityStock {
  string commodity = 1;
  double quantity_kg = 2;
  int32 receipt_count = 3;
  double avg_quality_score = 4;
}

// ===== Conversational Commerce Service (Python :8118) =====

service ConversationalCommerceService {
  rpc ProcessMessage(ChatMessage) returns (ChatResponse);
  rpc GetConversationHistory(ConversationHistoryRequest) returns (ConversationHistory);
  rpc ExecuteTransaction(TransactionIntent) returns (TransactionResult);
  rpc GetSupportedIntents(IntentsRequest) returns (IntentsList);
}

message ChatMessage {
  string user_id = 1;
  string message = 2;
  string channel = 3; // whatsapp, ussd, sms, web
  string language = 4;
  string session_id = 5;
}

message ChatResponse {
  string response_text = 1;
  string intent = 2;
  double confidence = 3;
  repeated ChatAction actions = 4;
  bool requires_confirmation = 5;
}

message ChatAction {
  string type = 1;
  string label = 2;
  string payload = 3;
}

message ConversationHistoryRequest {
  string user_id = 1;
  string session_id = 2;
  int32 limit = 3;
}

message ConversationHistory {
  repeated ConversationTurn turns = 1;
  string session_id = 2;
}

message ConversationTurn {
  string role = 1;
  string message = 2;
  string intent = 3;
  int64 timestamp = 4;
}

message TransactionIntent {
  string user_id = 1;
  string intent = 2;
  string commodity = 3;
  double quantity_kg = 4;
  double price = 5;
  string counterparty_id = 6;
  string confirmation_token = 7;
}

message TransactionResult {
  bool success = 1;
  string transaction_id = 2;
  string status = 3;
  string summary = 4;
  double amount = 5;
}

message IntentsRequest {
  string language = 1;
  string channel = 2;
}

message IntentsList {
  repeated SupportedIntent intents = 1;
}

message SupportedIntent {
  string intent = 1;
  string description = 2;
  repeated string example_phrases = 3;
  string category = 4;
}
