input {
  # TCP input for application logs
  tcp {
    port => 5000
    codec => json
  }
  
  # Beats input for Filebeat/Metricbeat
  beats {
    port => 5044
  }
  
  # HTTP input for webhook logs
  http {
    port => 8080
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # Add timestamp
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }
  
  # Classify log levels
  if [level] {
    mutate {
      lowercase => [ "level" ]
    }
  }
  
  # Extract user information
  if [userId] {
    mutate {
      add_field => { "user_id" => "%{userId}" }
    }
  }
  
  # Add environment tag
  mutate {
    add_field => { "environment" => "${ENVIRONMENT:production}" }
    add_field => { "service" => "farmer-data-collection" }
  }
}

output {
  # Send to OpenSearch
  opensearch {
    hosts => ["${OPENSEARCH_HOSTS:opensearch:9200}"]
    index => "farmer-logs-%{+YYYY.MM.dd}"
    user => "${OPENSEARCH_USERNAME:admin}"
    password => "${OPENSEARCH_PASSWORD:Admin@123}"
    ssl => true
    ssl_certificate_verification => false
  }
  
  # Debug output (optional)
  if [level] == "error" {
    stdout {
      codec => rubydebug
    }
  }
}
