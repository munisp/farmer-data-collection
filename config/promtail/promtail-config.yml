server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/**/*.log
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            msg: msg
            service: service
            trace_id: traceId
      - labels:
          level:
          service:
          trace_id:
      - timestamp:
          source: time
          format: RFC3339Nano

  - job_name: farmconnect-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: farmconnect
          __path__: /var/log/farmconnect/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            module: module
            trace_id: traceId
      - labels:
          level:
          module:
          trace_id:
