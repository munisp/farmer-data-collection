  # Analytics Service Routes
  - uri: /api/analytics/*
    name: analytics-service-route
    methods: [GET, POST]
    upstream:
      type: roundrobin
      nodes:
        "analytics-service:3008": 1
    plugins:
      openid-connect:
        client_id: farmer-api
        client_secret: ${KEYCLOAK_CLIENT_SECRET}
        discovery: http://keycloak:8080/realms/farmer-realm/.well-known/openid-configuration
        scope: openid profile email
        bearer_only: true
        realm: farmer-realm
      limit-req:
        rate: 100
        burst: 50
        key: remote_addr
      proxy-cache:
        cache_ttl: 60
        cache_key: ["$uri", "$args"]
      prometheus: {}
      request-id: {}

  # Health Check Route
  - uri: /health
    name: health-check
    methods: [GET]
    plugins:
      serverless-pre-function:
        phase: rewrite
        functions:
          - "return function() ngx.say('OK') end"

  # ============================================
  # MOJALOOP GATEWAY ROUTES
