# APISIX Routes Configuration for Farmer Data Collection Platform

routes:
  # Auth Service Routes
  - uri: /api/auth/*
    name: auth-service-route
    methods: [GET, POST, PUT, DELETE]
    upstream:
      type: roundrobin
      nodes:
        "auth-service:3001": 1
    plugins:
      limit-req:
        rate: 100
        burst: 50
        key: remote_addr
      prometheus: {}
      request-id: {}

  # Farmer Service Routes
  - uri: /api/farmers/*
    name: farmer-service-route
    methods: [GET, POST, PUT, DELETE]
    upstream:
      type: roundrobin
      nodes:
        "farmer-service:3002": 1
    plugins:
      openid-connect:
        client_id: farmer-api
        client_secret: ${KEYCLOAK_CLIENT_SECRET}
        discovery: http://keycloak:8080/realms/farmer-realm/.well-known/openid-configuration
        scope: openid profile email
        bearer_only: true
        realm: farmer-realm
      limit-req:
        rate: 200
        burst: 100
        key: remote_addr
      prometheus: {}
      request-id: {}

  # Farm Service Routes
  - uri: /api/farms/*
    name: farm-service-route
    methods: [GET, POST, PUT, DELETE]
    upstream:
      type: roundrobin
      nodes:
        "farm-service:3003": 1
    plugins:
