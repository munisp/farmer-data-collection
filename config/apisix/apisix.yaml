  # Mojaloop Transfers
  - uri: /api/mojaloop/transfer
    name: mojaloop-transfer
    methods: [POST]
    upstream:
      type: roundrobin
      nodes:
        "mojaloop-gateway:8080": 1
    plugins:
      openid-connect:
        client_id: mojaloop-gateway
        client_secret: ${KEYCLOAK_CLIENT_SECRET}
        discovery: http://keycloak:8080/realms/farmer-realm/.well-known/openid-configuration
        scope: openid profile email
        bearer_only: true
        realm: farmer-realm
      limit-req:
        rate: 50
        burst: 25
        key: remote_addr
      prometheus: {}
      request-id: {}
      kafka-logger:
        broker_list:
          "kafka:9092": 1
        kafka_topic: mojaloop.transfers
        producer_type: async

  # Mojaloop Bulk Transfers
  - uri: /api/mojaloop/bulk-transfer
