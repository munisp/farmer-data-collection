apiVersion: 1

policies:
  - orgId: 1
    receiver: Slack Alerts
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: PagerDuty Critical
        matchers:
          - severity = critical
        continue: true
        group_wait: 10s
        repeat_interval: 30m
      
      - receiver: Email Ops Team
        matchers:
          - severity = warning
        group_wait: 1m
        repeat_interval: 12h
