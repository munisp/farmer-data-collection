apiVersion: 1

groups:
  - orgId: 1
    name: Workflow Failures
    folder: Farmer Platform
    interval: 1m
    rules:
      - uid: workflow_failure_rate
        title: High Workflow Failure Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(temporal_workflow_failed_total[5m])
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.1]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          description: "Workflow failure rate is above 10% ({{ $values.A.Value }})"
          summary: High workflow failure rate detected
        labels:
          severity: critical
          team: platform

      - uid: service_down
        title: Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job=~"temporal|orchestrator|iot-service"}
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          description: "Service {{ $labels.job }} is down"
          summary: Critical service unavailable
        labels:
          severity: critical
          team: sre

  - orgId: 1
    name: Performance Degradation
    folder: Farmer Platform
    interval: 5m
    rules:
      - uid: high_latency
        title: High API Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [2]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: B
              type: threshold
        for: 10m
        annotations:
          description: "P95 latency is {{ $values.A.Value }}s (threshold: 2s)"
          summary: API response time degraded
        labels:
          severity: warning
          team: platform
