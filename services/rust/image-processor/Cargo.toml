[package]
name = "image-processor"
version = "0.1.0"
edition = "2021"
description = "High-performance image processing service for ag-fintech platform"
authors = ["Ag-Fintech Platform"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Image processing
image = "0.25"
fast_image_resize = "4"

# S3/RustFS client
aws-sdk-s3 = "1"
aws-config = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
bytes = "1"
mime_guess = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
