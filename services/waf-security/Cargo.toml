[package]
name = "waf-security"
version = "0.1.0"
edition = "2021"
description = "WAF + Input Sanitization proxy integrating OpenAppSec for FarmConnect"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
ammonia = "3"
