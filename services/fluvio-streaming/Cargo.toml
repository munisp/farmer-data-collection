[package]
name = "fluvio-streaming"
version = "0.1.0"
edition = "2021"
description = "Fluvio real-time data streaming pipeline for FarmConnect events"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4", features = ["serde"] }
