# oauth2-proxy configuration for Caddy forward-auth → Keycloak OIDC
# This proxy sits between Caddy and Keycloak, handling OIDC token validation
# and translating Keycloak JWT claims into X-Auth-Request-* headers

# Provider configuration
provider = "keycloak-oidc"
provider_display_name = "FarmerConnect SSO"

# Keycloak OIDC endpoints
oidc_issuer_url = "http://keycloak:8080/realms/farmconnect"
client_id = "farmconnect-caddy-proxy"
client_secret = "farmconnect-caddy-proxy-secret-change-in-production"

# Redirect URI (must match Keycloak client config)
redirect_url = "https://api.farmconnect.africa/oauth2/callback"

# Cookie settings
cookie_secret = "farmconnect-cookie-secret-32-bytes!!"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_name = "_farmconnect_oauth2"
cookie_expire = "24h"
cookie_refresh = "1h"

# Upstream (where to proxy authenticated requests)
upstreams = ["http://apisix:9080"]

# Listen address
http_address = "0.0.0.0:4180"

# Email domains (allow all for internal use)
email_domains = ["*"]

# Skip auth for health checks and public endpoints
skip_auth_routes = [
    "GET=^/health$",
    "GET=^/api/v1/health$",
    "GET=^/api/v1/public/",
    "GET=^/api/v1/market-prices/public",
    "POST=^/ussd/",
    "POST=^/ivr/",
    "GET=^/realms/",
    "POST=^/realms/"
]

# Pass user info headers to upstream
set_xauthrequest = true
pass_access_token = true
pass_authorization_header = true

# Scope
scope = "openid email profile roles"

# JWT validation
oidc_groups_claim = "groups"
oidc_email_claim = "email"

# Logging
logging_filename = ""
logging_max_size = 100
logging_max_age = 7
logging_local_time = false
standard_logging = true
request_logging = true
auth_logging = true

# Metrics
metrics_address = "0.0.0.0:9116"

# Session store (Redis-backed for horizontal scaling)
session_store_type = "redis"
redis_connection_url = "redis://redis:6379"
redis_password = ""
redis_use_sentinel = false

# PKCE support
code_challenge_method = "S256"

# Allowed groups (Keycloak realm roles)
allowed_groups = [
    "/farmer",
    "/buyer",
    "/admin",
    "/field-agent",
    "/cooperative-admin",
    "/financial-officer",
    "/government-official",
    "/logistics-provider",
    "/input-supplier",
    "/exporter",
    "/insurance-provider",
    "/researcher",
    "/api-developer",
    "/food-processor"
]

# Force HTTPS
force_https = true

# Banner
banner = "FarmerConnect Platform — Secure Access"
