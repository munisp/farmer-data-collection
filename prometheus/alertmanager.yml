global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_HOST}:${SMTP_PORT}"
  smtp_from: "alerts@farmerplatform.com"
  smtp_auth_username: "${SMTP_USERNAME}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  slack_api_url: "${SLACK_WEBHOOK_URL}"

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical-alerts
      group_wait: 10s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: warning-alerts
      repeat_interval: 4h
    - match:
        alertname: HighPaymentFailureRate
      receiver: finance-team
      group_wait: 10s
    - match:
        alertname: DatabaseDown
      receiver: critical-alerts
      group_wait: 0s
      repeat_interval: 5m

receivers:
  - name: default
    slack_configs:
      - channel: "#farmconnect-alerts"
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
        send_resolved: true
    email_configs:
      - to: "devops@farmerplatform.com"
        send_resolved: true

  - name: critical-alerts
    slack_configs:
      - channel: "#farmconnect-critical"
        title: "CRITICAL: {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true
    email_configs:
      - to: "oncall@farmerplatform.com"
        send_resolved: true
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: critical
        description: "{{ .CommonLabels.alertname }}: {{ .CommonAnnotations.summary }}"

  - name: warning-alerts
    slack_configs:
      - channel: "#farmconnect-alerts"
        title: "WARNING: {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
        send_resolved: true

  - name: finance-team
    slack_configs:
      - channel: "#farmconnect-finance"
        title: "FINANCE ALERT: {{ .CommonLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true
    email_configs:
      - to: "finance@farmerplatform.com"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "instance"]
